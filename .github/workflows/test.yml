name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mech_library
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: mech_library
      DB_USER: root
      DB_PASS: root

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Apply migrations
        run: vendor/bin/perpl migration:migrate

      - name: Test
        run: composer test

  docker:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Start stack
        run: |
          cp .env.example .env
          sed -i 's/^DB_PASS=.*/DB_PASS=ci-only-password/' .env
          docker compose up -d --build --wait

      - name: Smoke test
        run: |
          curl -fsS http://localhost:8080/auth/login | grep -q 'name="password"'
          printf 'ci-password-123\n' | docker compose exec -T app bin/console user:add ci --password-stdin
          docker compose exec -T app bin/console user:list | grep -q ci

      - name: Logs
        if: failure()
        run: docker compose logs
