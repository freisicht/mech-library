# Quick start: cp .env.example .env, set DB_PASS, then `docker compose up -d`.
# See README.md ("Running with Docker").
services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    volumes:
      - raw-cache:/var/www/html/data/raw
      - unit-images:/var/www/html/public/images/units
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${DB_NAME:-mech_library}
      MYSQL_USER: ${DB_USER:-mech_library}
      MYSQL_PASSWORD: ${DB_PASS:?set DB_PASS in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # TCP on purpose: during first-run init MySQL listens on the socket only.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  db-data:
  raw-cache:
  unit-images:
