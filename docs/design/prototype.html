// ─── DESIGN TOKENS (reactive to tweaks) ──────────────────────────────────────
function makeTokens(hue, glowIntensity) {
  const glowAlpha = { off: 0, low: 0.15, medium: 0.30, high: 0.55 }[glowIntensity] || 0.3;
  return {
    bg:          `oklch(0.10 0.025 240)`,
    bg2:         `oklch(0.13 0.022 240)`,
    bg3:         `oklch(0.16 0.02 235)`,
    border:      `oklch(0.28 0.06 ${hue})`,
    borderBright:`oklch(0.45 0.12 ${hue})`,
    cyan:        `oklch(0.72 0.15 ${hue})`,
    cyanDim:     `oklch(0.50 0.10 ${hue})`,
    cyanGlow:    `oklch(0.72 0.15 ${hue} / ${glowAlpha})`,
    amber:       `oklch(0.75 0.14 65)`,
    red:         `oklch(0.58 0.18 25)`,
    green:       `oklch(0.68 0.14 155)`,
    text:        `oklch(0.88 0.02 220)`,
    textDim:     `oklch(0.55 0.03 220)`,
    textFaint:   `oklch(0.35 0.02 220)`,
    glowAlpha,
  };
}

// ─── SHARED PRIMITIVES ────────────────────────────────────────────────────────
function CornerAccent({ pos='tl', size=10, color }) {
  const s = {
    tl: { top:0,    left:0,  borderTop:`2px solid ${color}`, borderLeft:`2px solid ${color}` },
    tr: { top:0,    right:0, borderTop:`2px solid ${color}`, borderRight:`2px solid ${color}` },
    bl: { bottom:0, left:0,  borderBottom:`2px solid ${color}`, borderLeft:`2px solid ${color}` },
    br: { bottom:0, right:0, borderBottom:`2px solid ${color}`, borderRight:`2px solid ${color}` },
  }[pos];
  return <div style={{ position:'absolute', width:size, height:size, ...s }} />;
}

function Panel({ children, style }) {
  const T = useMemo(() => window.__T, []);
  return (
    <div style={{
      background: T.bg2,
      border: `1px solid ${T.border}`,
      clipPath: 'polygon(7px 0, 100% 0, 100% 100%, 0 100%, 0 7px)',
      position: 'relative',
      ...style
    }}>{children}</div>
  );
}

function CyberLabel({ children, style }) {
  return (
    <span style={{
      fontFamily: "'Orbitron', monospace",
      fontSize: 8,
      fontWeight: 700,
      letterSpacing: '0.15em',
      textTransform: 'uppercase',
      color: window.__T.cyanDim,
      ...style
    }}>{children}</span>
  );
}

function CyberInput({ value, onChange, placeholder, style, autoFocus }) {
  const T = window.__T;
  const [focused, setFocused] = useState(false);
  return (
    <input
      value={value}
      onChange={e => onChange(e.target.value)}
      placeholder={placeholder}
      autoFocus={autoFocus}
      onFocus={() => setFocused(true)}
      onBlur={() => setFocused(false)}
      style={{
        background: 'oklch(0.08 0.02 240)',
        border: `1px solid ${focused ? T.cyan : T.border}`,
        color: T.text,
        fontFamily: "'JetBrains Mono', monospace",
        fontSize: 12,
        padding: '4px 8px',
        outline: 'none',
        clipPath: 'polygon(4px 0, 100% 0, 100% 100%, 0 100%, 0 4px)',
        boxShadow: focused ? `0 0 8px ${T.cyanGlow}` : 'none',
        transition: 'border-color 0.15s, box-shadow 0.15s',
        width: '100%',
        ...style
      }}
    />
  );
}

function CyberSelect({ value, onChange, options, style }) {
  const T = window.__T;
  return (
    <div style={{ position: 'relative', width: '100%', ...style }}>
      <select
        value={value}
        onChange={e => onChange(e.target.value)}
        style={{
          background: 'oklch(0.08 0.02 240)',
          border: `1px solid ${T.border}`,
          color: T.text,
          fontFamily: "'JetBrains Mono', monospace",
          fontSize: 12,
          padding: '4px 24px 4px 8px',
          outline: 'none',
          clipPath: 'polygon(4px 0, 100% 0, 100% 100%, 0 100%, 0 4px)',
          appearance: 'none',
          cursor: 'pointer',
          width: '100%',
        }}
      >
        {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
      </select>
      <span style={{ position:'absolute', right:8, top:'50%', transform:'translateY(-50%)', color:T.cyanDim, fontSize:9, pointerEvents:'none' }}>▼</span>
    </div>
  );
}

function CyberBtn({ children, onClick, variant='primary', style, small }) {
  const T = window.__T;
  const [hov, setHov] = useState(false);
  const colors = {
    primary:   { bg: hov ? T.cyan      : 'transparent',           border: T.cyan,   text: hov ? T.bg   : T.cyan    },
    secondary: { bg: hov ? T.bg3       : 'transparent',           border: T.border, text: hov ? T.text : T.textDim },
    danger:    { bg: hov ? T.red       : 'transparent',           border: T.red,    text: hov ? '#fff' : T.red     },
    add:       { bg: hov ? T.green     : 'oklch(0.16 0.04 155)',  border: T.green,  text: hov ? T.bg   : T.green   },
    ghost:     { bg: 'transparent',                                border: 'transparent', text: T.textDim },
  };
  const c = colors[variant] || colors.primary;
  return (
    <button
      onClick={onClick}
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      style={{
        background: c.bg,
        border: `1px solid ${c.border}`,
        color: c.text,
        fontFamily: "'Orbitron', monospace",
        fontSize: small ? 9 : 10,
        fontWeight: 700,
        letterSpacing: '0.1em',
        padding: small ? '3px 8px' : '5px 14px',
        cursor: 'pointer',
        clipPath: 'polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px)',
        transition: 'all 0.12s',
        boxShadow: (hov && c.border !== 'transparent') ? `0 0 10px ${c.border}60` : 'none',
        whiteSpace: 'nowrap',
        ...style
      }}
    >{children}</button>
  );
}

function Badge({ children, variant='default' }) {
  const T = window.__T;
  const colors = {
    default: { bg: T.bg3,                       border: T.border,   text: T.textDim },
    invalid: { bg: 'oklch(0.15 0.04 25)',        border: T.red,      text: T.red     },
    valid:   { bg: 'oklch(0.12 0.04 155)',       border: T.green,    text: T.green   },
    clan:    { bg: `oklch(0.12 0.04 ${window.__T.accentHue||195})`, border: T.cyan, text: T.cyan },
    is:      { bg: 'oklch(0.14 0.04 65)',        border: T.amber,    text: T.amber   },
  };
  const c = colors[variant] || colors.default;
  return (
    <span style={{
      display: 'inline-block',
      background: c.bg,
      border: `1px solid ${c.border}`,
      color: c.text,
      fontFamily: "'Orbitron', monospace",
      fontSize: 8,
      fontWeight: 700,
      letterSpacing: '0.12em',
      padding: '2px 6px',
      clipPath: 'polygon(3px 0, 100% 0, 100% calc(100% - 3px), calc(100% - 3px) 100%, 0 100%, 0 3px)',
      flexShrink: 0,
    }}>{children}</span>
  );
}

// ─── FILTER PANEL ─────────────────────────────────────────────────────────────
function FilterPanel({ filters, setFilters, onApply, onReset, isMobile }) {
  const T = window.__T;
  const [open, setOpen] = useState(!isMobile);

  function Field({ label, children, style }) {
    return (
      <div style={{ display:'flex', flexDirection:'column', gap:3, ...style }}>
        <CyberLabel>{label}</CyberLabel>
        {children}
      </div>
    );
  }

  function RangeRow({ label, minKey, maxKey }) {
    return (
      <Field label={label}>
        <div style={{ display:'flex', gap:4, alignItems:'center' }}>
          <CyberInput value={filters[minKey]||''} onChange={v=>setFilters(f=>({...f,[minKey]:v}))} placeholder="min" style={{width:52}} />
          <span style={{color:T.textFaint,fontSize:10}}>—</span>
          <CyberInput value={filters[maxKey]||''} onChange={v=>setFilters(f=>({...f,[maxKey]:v}))} placeholder="max" style={{width:52}} />
        </div>
      </Field>
    );
  }

  return (
    <div style={{
      background: T.bg2,
      border: `1px solid ${T.border}`,
      clipPath: 'polygon(7px 0, 100% 0, 100% 100%, 0 100%, 0 7px)',
      position: 'relative',
      flexShrink: 0,
    }}>
      <CornerAccent pos="tl" color={T.cyan} size={10} />

      {/* Header */}
      <div
        onClick={() => setOpen(o => !o)}
        style={{
          display:'flex', alignItems:'center', justifyContent:'space-between',
          padding:'7px 12px',
          borderBottom: open ? `1px solid ${T.border}` : 'none',
          cursor:'pointer', userSelect:'none',
          background: T.bg3,
        }}
      >
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span style={{color:T.cyan,fontSize:8}}>◆</span>
          <CyberLabel style={{color:T.cyan}}>Filter Matrix</CyberLabel>
        </div>
        <span style={{color:T.textFaint,fontSize:9,transform:open?'rotate(90deg)':'rotate(0)',transition:'transform 0.2s'}}>▶</span>
      </div>

      {open && (
        <div style={{padding:'10px 12px', display:'flex', flexDirection:'column', gap:10}}>
          {/* Row 1: Search / Type / PV / Move */}
          <div style={{display:'grid', gridTemplateColumns: isMobile ? '1fr 1fr' : '1fr 130px 120px 190px', gap:10}}>
            <Field label="Search" style={isMobile ? {gridColumn:'1/-1'} : {}}>
              <CyberInput value={filters.search||''} onChange={v=>setFilters(f=>({...f,search:v}))} placeholder="Name / Class / Variant" />
            </Field>
            <Field label="Type">
              <CyberSelect value={filters.type||'all'} onChange={v=>setFilters(f=>({...f,type:v}))} options={[
                {value:'all',label:'All types'},{value:'BM',label:'BattleMech'},
                {value:'PM',label:'ProtoMech'},{value:'CV',label:'Combat Veh.'},{value:'AF',label:'AeroFighter'}
              ]} />
            </Field>
            <Field label="PV Range">
              <div style={{display:'flex',gap:4,alignItems:'center'}}>
                <CyberInput value={filters.pvMin||''} onChange={v=>setFilters(f=>({...f,pvMin:v}))} placeholder="min" style={{width:46}} />
                <span style={{color:T.textFaint,fontSize:10}}>—</span>
                <CyberInput value={filters.pvMax||''} onChange={v=>setFilters(f=>({...f,pvMax:v}))} placeholder="max" style={{width:46}} />
              </div>
            </Field>
            <Field label="Move (inches)">
              <div style={{display:'flex',gap:4,alignItems:'center'}}>
                <CyberInput value={filters.moveMin||''} onChange={v=>setFilters(f=>({...f,moveMin:v}))} placeholder="min" style={{width:46}} />
                <span style={{color:T.textFaint,fontSize:10}}>—</span>
                <CyberInput value={filters.moveMax||''} onChange={v=>setFilters(f=>({...f,moveMax:v}))} placeholder="max" style={{width:46}} />
                <label style={{display:'flex',alignItems:'center',gap:4,color:T.textDim,fontSize:11,cursor:'pointer',whiteSpace:'nowrap'}}>
                  <input type="checkbox" checked={!!filters.jumpOnly} onChange={e=>setFilters(f=>({...f,jumpOnly:e.target.checked}))} style={{accentColor:T.cyan}} />
                  J only
                </label>
              </div>
            </Field>
          </div>

          {/* Row 2: TMM / S / M / L */}
          <div style={{display:'grid', gridTemplateColumns: isMobile ? '1fr 1fr' : '110px 160px 160px 160px', gap:10}}>
            <Field label="TMM ≥">
              <CyberInput value={filters.tmmMin||''} onChange={v=>setFilters(f=>({...f,tmmMin:v}))} placeholder="min" />
            </Field>
            <RangeRow label="Damage S" minKey="sMin" maxKey="sMax" />
            <RangeRow label="Damage M" minKey="mMin" maxKey="mMax" />
            <RangeRow label="Damage L" minKey="lMin" maxKey="lMax" />
          </div>

          {/* Row 3: Role / Tech / Era / Intro */}
          <div style={{display:'grid', gridTemplateColumns: isMobile ? '1fr 1fr' : '130px 150px 150px 180px', gap:10}}>
            <Field label="Role">
              <select multiple style={{
                background:'oklch(0.08 0.02 240)', border:`1px solid ${T.border}`,
                color:T.text, fontFamily:"'JetBrains Mono', monospace", fontSize:11,
                height:68, outline:'none', padding:'2px 6px',
              }}>
                {['Ambusher','Brawler','Juggernaut','Missile Boat','Skirmisher','Sniper','Scout','Striker'].map(r=>(
                  <option key={r}>{r}</option>
                ))}
              </select>
            </Field>
            <Field label="Tech Base">
              <select multiple style={{
                background:'oklch(0.08 0.02 240)', border:`1px solid ${T.border}`,
                color:T.text, fontFamily:"'JetBrains Mono', monospace", fontSize:11,
                height:68, outline:'none', padding:'2px 6px',
              }}>
                {['Clan','Inner Sphere','Mixed','Primitive'].map(r=>(
                  <option key={r}>{r}</option>
                ))}
              </select>
            </Field>
            <Field label="Era">
              <CyberSelect value={filters.era||'all'} onChange={v=>setFilters(f=>({...f,era:v}))} options={[
                {value:'all',label:'All eras'},{value:'sl',label:'Star League'},
                {value:'sw',label:'Succession Wars'},{value:'ci',label:'Clan Invasion'},
                {value:'cw',label:'Civil War'},{value:'ji',label:'Jihad'},
              ]} />
            </Field>
            <Field label="Intro Year">
              <div style={{display:'flex',gap:4,alignItems:'center'}}>
                <CyberInput value={filters.introFrom||''} onChange={v=>setFilters(f=>({...f,introFrom:v}))} placeholder="from" style={{width:58}} />
                <span style={{color:T.textFaint,fontSize:10}}>—</span>
                <CyberInput value={filters.introTo||''} onChange={v=>setFilters(f=>({...f,introTo:v}))} placeholder="to" style={{width:58}} />
              </div>
            </Field>
          </div>

          {/* Abilities + actions */}
          <div style={{display:'flex', flexWrap:'wrap', gap:8, alignItems:'flex-end'}}>
            <Field label="Abilities / Tags" style={{flex:1, minWidth:140}}>
              <CyberSelect value="pick" onChange={()=>{}} options={[
                {value:'pick',label:'— pick tag —'},{value:'CASE',label:'CASE'},
                {value:'ECM',label:'ECM'},{value:'OMNI',label:'OMNI'},{value:'LRM',label:'LRM'},{value:'TAG',label:'TAG'}
              ]} />
            </Field>
            <div style={{display:'flex',gap:4,alignItems:'center'}}>
              <span style={{color:T.textDim,fontSize:10}}>≥</span>
              <CyberInput value="" onChange={()=>{}} placeholder="val" style={{width:40}} />
            </div>
            <CyberBtn variant="primary" onClick={onApply}>Apply</CyberBtn>
            <CyberBtn variant="secondary" onClick={onReset}>Reset</CyberBtn>
            <div style={{display:'flex',alignItems:'center',gap:8,color:T.textDim,fontSize:11}}>
              <span style={{fontFamily:"'Orbitron',monospace",fontSize:8,letterSpacing:'0.1em',color:T.textFaint}}>MODE:</span>
              {['AND','OR'].map(m=>(
                <label key={m} style={{display:'flex',alignItems:'center',gap:4,cursor:'pointer'}}>
                  <input type="radio" name="filter-mode" defaultChecked={m==='AND'} style={{accentColor:T.cyan}} />
                  <span style={{fontSize:10}}>{m}</span>
                </label>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

  { key:'s',     label:'S', w:26, align:'right' },
  { key:'m',     label:'M', w:26, align:'right' },
  { key:'l',     label:'L', w:26, align:'right' },
];

function UnitTable({ units, onAdd, onSelect, compact, showAbilities, isMobile }) {
  const T = window.__T;
  const [hovRow, setHovRow] = useState(null);
  const [sortKey, setSortKey] = useState('name');
  const [sortDir, setSortDir] = useState(1);

  const COLS = isMobile ? COLS_MOBILE : COLS_DESKTOP;

  const sorted = useMemo(() => [...units].sort((a,b) => {
    const av = a[sortKey]??'', bv = b[sortKey]??'';
    return (av > bv ? 1 : av < bv ? -1 : 0) * sortDir;
  }), [units, sortKey, sortDir]);

  function toggleSort(key) {
    if (sortKey === key) setSortDir(d => -d);
    else { setSortKey(key); setSortDir(1); }
  }

  const rowH = compact ? 22 : 27;

  return (
    <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden', borderTop:`1px solid ${T.border}`}}>
      {/* Header */}
      <div style={{display:'flex', background:T.bg3, borderBottom:`1px solid ${T.borderBright}`, flexShrink:0, overflowX: isMobile ? 'auto' : 'visible'}}>
        {COLS.map(col => (
          <div
            key={col.key}
            onClick={() => col.key!=='add' && toggleSort(col.key)}
            style={{
              width: col.w==='auto' ? undefined : col.w,
              flex: col.w==='auto' ? 1 : undefined,
              minWidth: col.w==='auto' ? 80 : undefined,
              padding:'5px 5px',
              fontFamily:"'Orbitron', monospace",
              fontSize:8,
              fontWeight:700,
              letterSpacing:'0.1em',
              color: sortKey===col.key ? T.cyan : T.cyanDim,
              textAlign: col.align||'left',
              cursor: col.key!=='add'?'pointer':'default',
              userSelect:'none',
              borderRight:`1px solid ${T.border}`,
              whiteSpace:'nowrap',
              flexShrink:0,
            }}
          >
            {col.label}
            {sortKey===col.key && <span style={{marginLeft:2}}>{sortDir===1?'▲':'▼'}</span>}
          </div>
        ))}
      </div>

      {/* Body */}
      <div style={{flex:1, overflowY:'auto', overflowX: isMobile ? 'auto' : 'hidden'}}>
        {sorted.map((unit, i) => {
          const isHov = hovRow===unit.id;
          return (
            <div
              key={unit.id}
              onMouseEnter={() => setHovRow(unit.id)}
              onMouseLeave={() => setHovRow(null)}
              style={{
                display:'flex', alignItems:'center',
                height:rowH,
                background: isHov ? 'oklch(0.16 0.025 230)' : i%2===0 ? T.bg : T.bg2,
                borderBottom:`1px solid ${T.border}`,
                transition:'background 0.08s',
              }}
            >
              {/* + btn */}
              <div style={{width:32, display:'flex', justifyContent:'center', borderRight:`1px solid ${T.border}`, height:'100%', alignItems:'center', flexShrink:0}}>
                <button
                  onClick={() => onAdd(unit)}
                  title={`Add ${unit.name} to formation`}
                  style={{
                    width:18, height:18,
                    background: isHov ? T.green : 'oklch(0.16 0.04 155)',
                    border:`1px solid ${T.green}`,
                    color: T.bg,
                    fontSize:14, fontWeight:700, lineHeight:1,
                    cursor:'pointer',
                    display:'flex', alignItems:'center', justifyContent:'center',
                    clipPath:'polygon(3px 0, 100% 0, 100% calc(100% - 3px), calc(100% - 3px) 100%, 0 100%, 0 3px)',
                    transition:'background 0.1s',
                  }}
                >+</button>
              </div>
              {/* Name */}
              <div
                onClick={() => onSelect(unit)}
                style={{width:isMobile?140:176, padding:'0 6px', color:isHov?T.cyan:T.text, cursor:'pointer', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', borderRight:`1px solid ${T.border}`, fontSize:compact?11:12, flexShrink:0}}
              >{unit.name}</div>
              {/* Desktop cols */}
              {!isMobile && <>
                <div style={{width:100, padding:'0 6px', color:T.textDim, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', borderRight:`1px solid ${T.border}`, fontSize:compact?11:12, flexShrink:0}}>{unit.cls}</div>
                <div style={{width:28, padding:'0 3px', color:T.textFaint, textAlign:'center', borderRight:`1px solid ${T.border}`, fontSize:10, flexShrink:0}}>{unit.type}</div>
              </>}
              {/* PV */}
              <div style={{width:38, padding:'0 5px', color:T.amber, textAlign:'right', borderRight:`1px solid ${T.border}`, fontSize:compact?11:12, fontWeight:600, flexShrink:0}}>{unit.pv}</div>
              {/* Move */}
              <div style={{width:isMobile?58:72, padding:'0 5px', color:T.textDim, borderRight:`1px solid ${T.border}`, fontSize:compact?10:11, flexShrink:0, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{unit.move}</div>
              {/* Desktop TMM */}
              {!isMobile && <div style={{width:38, padding:'0 5px', textAlign:'right', borderRight:`1px solid ${T.border}`, fontSize:compact?10:11, color:T.textDim, flexShrink:0}}>{unit.tmm}</div>}
              {/* S M L */}
              {['s','m','l'].map(k=>(
                <div key={k} style={{width:26, padding:'0 3px', textAlign:'right', borderRight:`1px solid ${T.border}`, fontSize:compact?11:12, color:T.text, fontWeight:500, flexShrink:0}}>{unit[k]}</div>
              ))}
              {/* Desktop ARM STR Abilities */}
              {!isMobile && <>
                {['armor','str'].map(k=>(
                  <div key={k} style={{width:36, padding:'0 5px', textAlign:'right', borderRight:`1px solid ${T.border}`, fontSize:compact?10:11, color:T.textDim, flexShrink:0}}>{unit[k]}</div>
                ))}
                {showAbilities && <div style={{flex:1, padding:'0 6px', color:T.textFaint, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', fontSize:compact?9:10}}>{unit.abilities}</div>}
              </>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

  const panelStyle = isMobile ? {
    position:'fixed', inset:0, zIndex:100,

          ? <button onClick={onMobileClose} style={{background:'none',border:'none',color:T.textFaint,cursor:'pointer',fontSize:14}}>✕</button>

          <CyberSelect value="f1" onChange={()=>{}} options={[{value:'f1',label:'Testformation1'},{value:'f2',label:'meine tolle Formation'}]} style={{flex:1}} />

            <button onClick={()=>setEditing(e=>!e)} style={{background:'none',border:'none',color:T.textFaint,cursor:'pointer',fontSize:13,padding:2}}>✎</button>

            </div>
          ))}
        </div>

        {/* Actions */}
        <div style={{padding:10,display:'flex',flexDirection:'column',gap:6}}>
          <CyberBtn variant="secondary" style={{width:'100%',justifyContent:'center',display:'flex'}}>Show Matching Units</CyberBtn>

        {/* Armies */}
        <div
          style={{padding:'6px 10px',borderTop:`1px solid ${T.border}`,display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer'}}
          onMouseEnter={e=>e.currentTarget.style.background=T.bg3}

          <CyberLabel>Armies</CyberLabel>
          <span style={{color:T.textFaint,fontSize:10}}>▶</span>
        </div>
      </div>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  // Tweaks — useTweaks is exported to window by tweaks-panel.jsx
  const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);

  // Expose tokens globally so child components can access without prop drilling
  window.__T = useMemo(() => ({
    ...makeTokens(tweaks.accentHue, tweaks.glowIntensity),
    accentHue: tweaks.accentHue,
  }), [tweaks.accentHue, tweaks.glowIntensity]);

  const T = window.__T;

  // Responsive
  const [isMobile, setIsMobile] = useState(window.innerWidth < 768);
  const [mobileFormOpen, setMobileFormOpen] = useState(false);
  useEffect(() => {
    const fn = () => setIsMobile(window.innerWidth < 768);
    window.addEventListener('resize', fn);
    return () => window.removeEventListener('resize', fn);
  }, []);

  // View state
  const [view, setView] = useState('list');
  const [selectedUnit, setSelectedUnit] = useState(null);
  const [filters, setFilters] = useState({});

  const filtered = useMemo(() => UNITS.filter(u => {
    if (filters.search) {
      const s = filters.search.toLowerCase();
      if (!u.name.toLowerCase().includes(s) && !u.cls.toLowerCase().includes(s) && !u.variant.toLowerCase().includes(s)) return false;
    }
    if (filters.type && filters.type !== 'all' && u.type !== filters.type) return false;
    return true;
  }), [filters]);

  function handleSelect(unit) { setSelectedUnit(unit); setView('detail'); }
  function handleAdd(unit) { /* hook into real state */ }

  // Scanlines
  const scanlineStyle = tweaks.scanlines ? {
    position:'fixed', inset:0, zIndex:9998, pointerEvents:'none',
    background:'repeating-linear-gradient(0deg,transparent,transparent 2px,oklch(0 0 0 / 0.04) 2px,oklch(0 0 0 / 0.04) 4px)',
  } : null;

  // Tweaks components from window
  const TP = window.TweaksPanel;
  const TS = window.TweakSection;
  const TSlider = window.TweakSlider;
  const TToggle = window.TweakToggle;
  const TRadio  = window.TweakRadio;

  return (
    <div style={{width:'100%',height:'100%',display:'flex',flexDirection:'column',background:T.bg,color:T.text,fontFamily:"'JetBrains Mono',monospace"}}>
      {scanlineStyle && <div style={scanlineStyle} />}

      <TopBar isMobile={isMobile} onFormationToggle={()=>setMobileFormOpen(true)} />

      <div style={{flex:1,display:'flex',overflow:'hidden'}}>
        {/* Left / Main */}
        <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
          {view==='list' ? (
            <>
              <div style={{padding:'8px 10px 0',flexShrink:0}}>
                <FilterPanel filters={filters} setFilters={setFilters} onApply={()=>{}} onReset={()=>setFilters({})} isMobile={isMobile} />
              </div>
              <UnitTable units={filtered} onAdd={handleAdd} onSelect={handleSelect} compact={tweaks.compactRows} showAbilities={tweaks.showAbilities} isMobile={isMobile} />
              <StatusBar count={filtered.length} />
            </>
          ) : (
            <UnitDetail unit={selectedUnit} onBack={()=>setView('list')} onAdd={handleAdd} />
          )}
        </div>

        {/* Formation panel — desktop side, mobile overlay */}
        {!isMobile && (
          <FormationPanel onShowDetail={handleSelect} isMobile={false} />
        )}
        {isMobile && (
          <FormationPanel onShowDetail={u=>{handleSelect(u);setMobileFormOpen(false);}} isMobile={true} mobileOpen={mobileFormOpen} onMobileClose={()=>setMobileFormOpen(false)} />
        )}
      </div>

      {/* Tweaks panel */}
      {TP && (
        <TP title="Tweaks">
          <TS label="Display">
            <TToggle label="Compact rows"  value={tweaks.compactRows}    onChange={v=>setTweak('compactRows',v)} />
            <TToggle label="Show abilities" value={tweaks.showAbilities}  onChange={v=>setTweak('showAbilities',v)} />
            <TToggle label="Scanlines"     value={tweaks.scanlines}      onChange={v=>setTweak('scanlines',v)} />
          </TS>
          <TS label="Style">
            <TRadio  label="Glow"          value={tweaks.glowIntensity}  options={['off','low','medium','high']}  onChange={v=>setTweak('glowIntensity',v)} />
            <TSlider label="Accent hue"    value={tweaks.accentHue}      min={150} max={260} step={5} unit="°"   onChange={v=>setTweak('accentHue',v)} />
          </TS>
        </TP>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
